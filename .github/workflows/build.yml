name: Build APKs

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x IntervalTimer/gradlew

      - name: Build mobile debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: IntervalTimer

      - name: Build wear debug APK
        run: ./gradlew :wear:assembleDebug
        working-directory: IntervalTimer

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: IntervalTimer/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug
          path: IntervalTimer/wear/build/outputs/apk/debug/wear-debug.apk
